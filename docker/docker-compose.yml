# Run on YOUR machine. This sandbox has no Docker daemon.
# From this folder: docker compose up -d
# WordPress: http://localhost:8081
# Then: Appearance → WX Theme · Plugins → Woodex Core · Elementor + Xpro from wordpress.org

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: woodex
      MYSQL_USER: woodex
      MYSQL_PASSWORD: woodex
      MYSQL_ROOT_PASSWORD: woodex-root
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  wordpress:
    image: wordpress:6.8-php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: woodex
      WORDPRESS_DB_PASSWORD: woodex
      WORDPRESS_DB_NAME: woodex
      WORDPRESS_DEBUG: 0
    volumes:
      - wp_data:/var/www/html
      - ../WP-THEME/src/wx-theme:/var/www/html/wp-content/themes/wx-theme
      - ../WP-THEME/src/woodex:/var/www/html/wp-content/themes/woodex
      - ../WP-THEME/src/woodex-core:/var/www/html/wp-content/plugins/woodex-core

volumes:
  db_data:
  wp_data:
